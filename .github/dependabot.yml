# Weekly update proposals for the libraries and tools Yardsyncs depends on (security fixes arrive as pull requests,
# which CI then tests like any other change).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 5
    groups:
      microsoft: { patterns: ["Microsoft.*", "System.*", "Npgsql*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 5
    ignore:
      # Node's types follow the Node version we run (an LTS release), changed by hand with the Dockerfile and CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pub
    directory: /mobile
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: sunday }
    ignore:
      # Node moves only between LTS releases (even numbers), by hand; patch and minor updates still come.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
