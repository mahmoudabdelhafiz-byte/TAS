name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TAS_TEST_DB: Host=localhost;Port=5432;Database=tas_test;Username=postgres;Password=postgres
      TAS_API_TEST_DB: Host=localhost;Port=5432;Database=tas_api_test;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the schema check compares with the base branch

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Create database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tas_test -v ON_ERROR_STOP=1 -q -f db/schema.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE tas_api_test"
          psql -h localhost -U postgres -d tas_api_test -v ON_ERROR_STOP=1 -q -f db/schema.sql

      - name: Schema matches migrations
        if: github.event_name == 'pull_request'
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash db/check-migrations.sh "origin/${{ github.base_ref }}"

      - name: Restore
        run: dotnet restore TAS.slnx

      - name: Build
        run: dotnet build TAS.slnx --no-restore -c Release

      - name: Unit tests
        run: >-
          dotnet test tests/Tas.Application.Tests --no-build -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Database integration tests
        run: >-
          dotnet test tests/Tas.Infrastructure.Tests --no-build -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: API tests
        run: >-
          dotnet test tests/Tas.Api.Tests --no-build -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFileName=api.trx" --results-directory TestResults

      - name: Publish test results
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in sorted(glob.glob("TestResults/*.trx")):
              root = ET.parse(path).getroot()
              c = root.find(".//t:Counters", ns).attrib
              name = os.path.basename(path)
              print(f"::notice title={name}::total={c['total']} passed={c['passed']} failed={c['failed']}")
              for r in root.findall(".//t:UnitTestResult", ns):
                  if r.get("outcome") != "Failed":
                      continue
                  msg = r.findtext(".//t:ErrorInfo/t:Message", default="", namespaces=ns)
                  trace = r.findtext(".//t:ErrorInfo/t:StackTrace", default="", namespaces=ns)
                  first_frame = next((l.strip() for l in trace.splitlines() if " in " in l), "")
                  text = f"{msg} | {first_frame}".replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:1500]
                  print(f"::error title={r.get('testName')}::{text}")
      - name: Known vulnerabilities in packages
        run: |
          dotnet list TAS.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          grep -E "^\s+>\s" vulnerable.txt | sed -E 's/\s+/ /g' | sort -u | head -30 | while read -r line; do
            echo "::warning title=vulnerable package::$line"
          done || true

      - name: Publish build errors
        if: failure()
        run: |
          dotnet build TAS.slnx --no-restore -c Release 2>&1 | grep -E "error [A-Z]+[0-9]+" | sort -u | head -30 | while read -r line; do
            echo "::error title=Build::$line"
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Known vulnerabilities in packages
        run: |
          npm audit --omit=dev --json > audit.json || true
          jq -r '.vulnerabilities // {} | to_entries[] | "\(.value.severity) \(.key) \(.value.range)"' audit.json | sort -u | head -20 \
            | while read -r line; do echo "::warning title=npm audit::$line"; done || true

      - name: Publish errors
        if: failure()
        run: |
          npx tsc -p tsconfig.json --pretty false 2>&1 | head -30 | while read -r line; do echo "::error title=web typecheck::$line"; done
          npm test 2>&1 | grep -E "not ok|Error|expected|actual" | head -20 | while read -r line; do echo "::error title=web test::$line"; done
          npx vite build 2>&1 | grep -iE "error" | head -20 | while read -r line; do echo "::error title=web build::$line"; done

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform folders
        run: |
          flutter create --platforms=android --org com.yardsyncs --project-name yardsyncs_mobile .
          bash tool/configure_android.sh

      - name: Install
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build APK (debug, for testers)
        run: flutter build apk --debug --dart-define=YARDSYNCS_API=https://tas.example.invalid

      - uses: actions/upload-artifact@v4
        with:
          name: yardsyncs-mobile-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Publish errors
        if: failure()
        run: |
          flutter analyze --no-fatal-infos 2>&1 | grep -E "^\s*(error|warning)" | head -30 | while read -r line; do echo "::error title=mobile analyze::$line"; done
          flutter test 2>&1 | grep -E "Expected|Actual|Error|error:|FAILED|Exception" | head -30 | while read -r line; do echo "::error title=mobile test::$line"; done
          flutter build apk --debug --dart-define=YARDSYNCS_API=https://tas.example.invalid 2>&1 | grep -iE "error|what went wrong|failed|requires|version|>" | grep -v "^\s*$" | head -40 | while read -r line; do echo "::error title=mobile build::$line"; done

  # The same app on iPhone: build without signing (signing and store upload need the Apple developer account).
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform folder
        run: |
          flutter create --platforms=ios --org com.yardsyncs --project-name yardsyncs_mobile .
          flutter pub get
          bash tool/configure_ios.sh

      - name: Build for iPhone (debug, unsigned)
        run: flutter build ios --debug --no-codesign --dart-define=YARDSYNCS_API=https://tas.example.invalid

      - name: Publish errors
        if: failure()
        run: |
          flutter build ios --debug --no-codesign --dart-define=YARDSYNCS_API=https://tas.example.invalid 2>&1 | grep -iE "error|failed|requires|deployment|pod" | head -40 | while read -r line; do echo "::error title=ios build::$line"; done

  # The deployable server: build the image, start it with a fresh database the way deploy/ does, and check that it
  # creates the schema, answers ready, serves the portal, signs the bootstrap admin in, restarts cleanly and backs up.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: |
          set -o pipefail
          docker build --progress=plain -t yardsyncs:latest --build-arg VERSION=0.1.0-ci.${GITHUB_SHA::7} . 2>&1 | tee build.log || {
            grep -iE "error|failed|npm err|not found|cannot|denied" build.log | grep -v "^#[0-9]* DONE" | tail -30 | while read -r line; do echo "::error title=image build::$line"; done
            exit 1
          }

      - name: Start database and app
        working-directory: deploy
        run: |
          cat > .env <<EOF
          TAS_DOMAIN=localhost
          TLS=internal
          DB_PASSWORD=ci$(openssl rand -hex 12)
          Jwt__SigningKey=$(openssl rand -base64 48)
          GatePass__Key=$(openssl rand -base64 32)
          Bootstrap__AdminEmail=admin@ci.example
          Bootstrap__AdminPassword=Yard-Ci-2026-pass
          Tos__Adapter=Fake
          EOF
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml up -d db app

      - name: Ready, portal, sign-in, restart, backup
        working-directory: deploy
        run: |
          ready() { for i in $(seq 1 60); do curl -fsS localhost:8080/health/ready > ready.json 2>/dev/null && return 0; sleep 3; done; return 1; }
          ready && cat ready.json && grep -q Healthy ready.json
          curl -fsS localhost:8080/ | grep -q 'id="root"'
          curl -fsSI localhost:8080/health/live | grep -qi 'content-security-policy'
          curl -fsS -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@ci.example","password":"Yard-Ci-2026-pass"}' | grep -q accessToken
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml restart app
          ready && grep -q Healthy ready.json
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml run --rm backup now
          ls -l backups/ && ls backups/tas-*.dump

      - name: Upgrade and roll back
        working-directory: deploy
        env:
          COMPOSE_FILES: -f docker-compose.yml -f docker-compose.smoke.yml
          READY_URL: http://localhost:8080/health/ready
          READY_SECONDS: "180"
        run: |
          psql() { docker compose $COMPOSE_FILES exec -T db psql -U tas -d tas -Atc "$1"; }
          docker tag yardsyncs:latest yardsyncs:ci-next
          ./upgrade.sh yardsyncs:ci-next
          grep -q '^YARDSYNCS_IMAGE=yardsyncs:ci-next$' .env
          psql "CREATE TABLE made_after_upgrade (x int)"
          ./upgrade.sh --status
          ./upgrade.sh --rollback
          grep -q '^YARDSYNCS_IMAGE=yardsyncs:latest$' .env
          [ "$(psql "SELECT to_regclass('made_after_upgrade') IS NULL")" = "t" ]
          curl -fsS -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@ci.example","password":"Yard-Ci-2026-pass"}' | grep -q accessToken

      - name: Known vulnerabilities in the image
        run: bash .github/scan-image.sh yardsyncs:latest false

      # Peak hour on the CI runner: dispatchers booking the busy hours, trucks reporting positions, control room
      # watching (loadtest/README.md). Thresholds in loadtest/peak.js; the booking rules are checked afterwards.
      - name: Load test
        working-directory: deploy
        run: |
          compose="docker compose -f docker-compose.yml -f docker-compose.smoke.yml -f ../loadtest/compose.load.yml"
          $compose up -d app
          for i in $(seq 1 60); do curl -fsS localhost:8080/health/ready >/dev/null 2>&1 && break; sleep 3; done
          set +e
          docker run --rm --network host --user "$(id -u)" -v "$PWD/../loadtest:/scripts" grafana/k6:0.54.0 \
            run --quiet --summary-export /scripts/summary.json /scripts/peak.js > ../loadtest/k6.log 2>&1
          result=$?
          set -e
          tail -60 ../loadtest/k6.log
          if [ -f ../loadtest/summary.json ]; then
            jq -r '.metrics | to_entries[] | select(.key | test("^http_req_duration\\{name:")) |
              "\(.key | capture("name:(?<n>[^}]+)").n): p95 \(.value["p(95)"] | floor) ms, p99 \(.value["p(99)"] | floor) ms, max \(.value.max | floor) ms"' \
              ../loadtest/summary.json | while read -r line; do echo "::notice title=load::$line"; done
            jq -r '"requests \(.metrics.http_reqs.count) (\(.metrics.http_reqs.rate | floor)/s), failed \(.metrics.http_req_failed.value * 100 | . * 100 | floor / 100)%, booked \(.metrics.booked.count // 0), slot taken \(.metrics.slot_taken.count // 0), no slot left \(.metrics.no_slot_left.count // 0)"' \
              ../loadtest/summary.json | while read -r line; do echo "::notice title=load::$line"; done
          fi
          grep -E "✗|crossed|threshold" ../loadtest/k6.log | head -20 | while read -r line; do echo "::warning title=k6::$line"; done || true
          exit $result

      - name: Booking rules after the load
        working-directory: deploy
        run: |
          line=$(docker compose -f docker-compose.yml -f docker-compose.smoke.yml exec -T db psql -U tas -d tas -At < ../loadtest/check.sql 2>&1) || {
            echo "::error title=booking rules::$line"; exit 1; }
          echo "::notice title=booking rules::$line"
          echo "$line" | tr ' ' '\n' | grep -vE '^(appointments|connections)=' | grep -v '=0$' && exit 1 || true

      - name: Logs
        if: always()
        working-directory: deploy
        run: |
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml logs --no-color app | tail -80
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml logs --no-color app 2>&1 | grep -iE '"LogLevel":"(Error|Critical)"|fail|exception' | head -20 | while read -r line; do echo "::warning title=app log::$line"; done || true

