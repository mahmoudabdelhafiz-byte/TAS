name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TAS_TEST_DB: Host=localhost;Port=5432;Database=tas_test;Username=postgres;Password=postgres
      TAS_API_TEST_DB: Host=localhost;Port=5432;Database=tas_api_test;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Create database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tas_test -v ON_ERROR_STOP=1 -q -f db/schema.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE tas_api_test"
          psql -h localhost -U postgres -d tas_api_test -v ON_ERROR_STOP=1 -q -f db/schema.sql

      - name: Restore
        run: dotnet restore TAS.slnx

      - name: Build
        run: dotnet build TAS.slnx --no-restore -c Release

      - name: Unit tests
        run: >-
          dotnet test tests/Tas.Application.Tests --no-build -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Database integration tests
        run: >-
          dotnet test tests/Tas.Infrastructure.Tests --no-build -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: API tests
        run: >-
          dotnet test tests/Tas.Api.Tests --no-build -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFileName=api.trx" --results-directory TestResults

      - name: Publish test results
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in sorted(glob.glob("TestResults/*.trx")):
              root = ET.parse(path).getroot()
              c = root.find(".//t:Counters", ns).attrib
              name = os.path.basename(path)
              print(f"::notice title={name}::total={c['total']} passed={c['passed']} failed={c['failed']}")
              for r in root.findall(".//t:UnitTestResult", ns):
                  if r.get("outcome") != "Failed":
                      continue
                  msg = r.findtext(".//t:ErrorInfo/t:Message", default="", namespaces=ns)
                  trace = r.findtext(".//t:ErrorInfo/t:StackTrace", default="", namespaces=ns)
                  first_frame = next((l.strip() for l in trace.splitlines() if " in " in l), "")
                  text = f"{msg} | {first_frame}".replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:1500]
                  print(f"::error title={r.get('testName')}::{text}")
      - name: Publish build errors
        if: failure()
        run: |
          dotnet build TAS.slnx --no-restore -c Release 2>&1 | grep -E "error [A-Z]+[0-9]+" | sort -u | head -30 | while read -r line; do
            echo "::error title=Build::$line"
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Publish errors
        if: failure()
        run: |
          npx tsc -p tsconfig.json --pretty false 2>&1 | head -30 | while read -r line; do echo "::error title=web typecheck::$line"; done
          npm test 2>&1 | grep -E "not ok|Error|expected|actual" | head -20 | while read -r line; do echo "::error title=web test::$line"; done
          npx vite build 2>&1 | grep -iE "error" | head -20 | while read -r line; do echo "::error title=web build::$line"; done

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform folders
        run: |
          flutter create --platforms=android --org com.yardsyncs --project-name yardsyncs_mobile .
          bash tool/configure_android.sh

      - name: Install
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build APK (debug, for testers)
        run: flutter build apk --debug --dart-define=YARDSYNCS_API=https://tas.example.invalid

      - uses: actions/upload-artifact@v4
        with:
          name: yardsyncs-mobile-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Publish errors
        if: failure()
        run: |
          flutter analyze --no-fatal-infos 2>&1 | grep -E "^\s*(error|warning)" | head -30 | while read -r line; do echo "::error title=mobile analyze::$line"; done
          flutter test 2>&1 | grep -E "Expected|Actual|Error|error:|FAILED|Exception" | head -30 | while read -r line; do echo "::error title=mobile test::$line"; done
          flutter build apk --debug --dart-define=YARDSYNCS_API=https://tas.example.invalid 2>&1 | grep -iE "error|what went wrong|failed|requires|version|>" | grep -v "^\s*$" | head -40 | while read -r line; do echo "::error title=mobile build::$line"; done

  # The same app on iPhone: build without signing (signing and store upload need the Apple developer account).
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform folder
        run: |
          flutter create --platforms=ios --org com.yardsyncs --project-name yardsyncs_mobile .
          flutter pub get
          bash tool/configure_ios.sh

      - name: Build for iPhone (debug, unsigned)
        run: flutter build ios --debug --no-codesign --dart-define=YARDSYNCS_API=https://tas.example.invalid

      - name: Publish errors
        if: failure()
        run: |
          flutter build ios --debug --no-codesign --dart-define=YARDSYNCS_API=https://tas.example.invalid 2>&1 | grep -iE "error|failed|requires|deployment|pod" | head -40 | while read -r line; do echo "::error title=ios build::$line"; done

