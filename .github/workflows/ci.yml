name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TAS_TEST_DB: Host=localhost;Port=5432;Database=tas_test;Username=postgres;Password=postgres
      TAS_API_TEST_DB: Host=localhost;Port=5432;Database=tas_api_test;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Create empty API test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE tas_api_test"

      - name: Restore
        run: dotnet restore TAS.slnx

      - name: Build
        run: dotnet build TAS.slnx --no-restore -c Release

      # The same command used in deployments: create the schema from db/migrations.
      - name: Migrate test databases
        run: |
          ConnectionStrings__Tas="$TAS_TEST_DB" dotnet src/Tas.Api/bin/Release/net10.0/Tas.Api.dll migrate
          ConnectionStrings__Tas="$TAS_API_TEST_DB" dotnet src/Tas.Api/bin/Release/net10.0/Tas.Api.dll migrate
          ConnectionStrings__Tas="$TAS_TEST_DB" dotnet src/Tas.Api/bin/Release/net10.0/Tas.Api.dll migrate status

      - name: Unit tests
        run: >-
          dotnet test tests/Tas.Application.Tests --no-build -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Database integration tests
        run: >-
          dotnet test tests/Tas.Infrastructure.Tests --no-build -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: API tests
        run: >-
          dotnet test tests/Tas.Api.Tests --no-build -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFileName=api.trx" --results-directory TestResults

      - name: Publish test results
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in sorted(glob.glob("TestResults/*.trx")):
              root = ET.parse(path).getroot()
              c = root.find(".//t:Counters", ns).attrib
              name = os.path.basename(path)
              print(f"::notice title={name}::total={c['total']} passed={c['passed']} failed={c['failed']}")
              for r in root.findall(".//t:UnitTestResult", ns):
                  if r.get("outcome") != "Failed":
                      continue
                  msg = r.findtext(".//t:ErrorInfo/t:Message", default="", namespaces=ns)
                  trace = r.findtext(".//t:ErrorInfo/t:StackTrace", default="", namespaces=ns)
                  first_frame = next((l.strip() for l in trace.splitlines() if " in " in l), "")
                  text = f"{msg} | {first_frame}".replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:1500]
                  print(f"::error title={r.get('testName')}::{text}")
      - name: Publish build errors
        if: failure()
        run: |
          dotnet build TAS.slnx --no-restore -c Release 2>&1 | grep -E "error [A-Z]+[0-9]+" | sort -u | head -30 | while read -r line; do
            echo "::error title=Build::$line"
          done

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Keep the lock file
        uses: actions/upload-artifact@v4
        with:
          name: portal-package-lock
          path: portal/package-lock.json

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml

      - name: Build
        run: npm run build

      - name: Publish test counts
        if: always()
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          path = "test-results/unit.xml"
          if os.path.exists(path):
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              total = sum(int(s.get("tests", 0)) for s in suites)
              failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
              print(f"::notice title=portal unit::total={total} passed={total - failed} failed={failed}")
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is not None:
                      text = (failure.get("message") or failure.text or "")[:1200].replace("\n", "%0A")
                      print(f"::error title={case.get('name')}::{text}")

      - uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: portal/dist

  e2e:
    runs-on: ubuntu-latest
    needs: portal
    permissions:
      contents: write   # pushes the screenshots to the ci-screenshots branch for review

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      ConnectionStrings__Tas: Host=localhost;Port=5432;Database=tas_e2e;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: portal/dist

      - name: Build the API
        run: dotnet build src/Tas.Api -c Release

      - name: Start the API serving the portal
        run: |
          ASPNETCORE_ENVIRONMENT=Development \
          Portal__Path="$GITHUB_WORKSPACE/portal/dist" \
          RateLimit__AuthPerMinute=500 \
          nohup dotnet src/Tas.Api/bin/Release/net10.0/Tas.Api.dll --urls http://localhost:5000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5000/health && break; sleep 1; done
          curl -sf http://localhost:5000/health
          curl -sf http://localhost:5000/sign-in | grep -q '<div id="root">'

      - name: Install Playwright
        working-directory: portal
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: portal
        env:
          TAS_PORTAL_URL: http://localhost:5000
        run: npx playwright test

      - name: Show the API log on failure
        if: failure()
        run: |
          python3 portal/e2e/ci_diagnostics.py

      # Screenshots on a separate branch (one commit, replaced each run): readable with plain git.
      - name: Publish screenshots
        if: always() && hashFiles('portal/e2e/screenshots/*.png') != ''
        run: |
          branch="ci-screenshots/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          mkdir /tmp/shots && cp portal/e2e/screenshots/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b main
          git config user.name "TAS CI"
          git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Screenshots of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          echo "::notice title=screenshots::branch ${branch}"

      - name: Screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-e2e
          path: |
            portal/e2e/screenshots
            portal/playwright-report
            portal/test-results
            api.log
