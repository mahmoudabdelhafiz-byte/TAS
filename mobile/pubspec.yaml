name: yardsyncs_mobile
description: Yardsyncs mobile, the driver app — appointments, gate code, trip tracking and spoken directions in the yard for truck drivers.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  crypto: ^3.0.6
  geolocator: ^13.0.2
  flutter_tts: ^4.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
